events {
    # Mała pula ułatwia ataki wyczerpujące połączenia
    worker_connections 256; 
}

http {
    server {
        listen 80;
        
        # --- PODATNOŚCI NA ATAKI LOW-RATE ---
        
        # Podatność na RUDY: Czekamy bardzo długo na ciało zapytania POST
        client_body_timeout 300s;
        
        # Podatność na Slowloris: Czekamy bardzo długo na dokończenie nagłówków HTTP
        client_header_timeout 300s;
        
        # Podatność na Slow Read: Długi timeout na wysyłanie danych do wolnego klienta
        send_timeout 300s;
        
        keepalive_timeout 300s;
        
        # --- KONIEC PODATNOŚCI ---

        location / {
            proxy_pass http://backend_app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # KLUCZOWE DLA SLOW READ:
            # Wyłączenie buforowania sprawia, że Nginx musi przesyłać dane na żywo.
            # Wolny klient blokuje bezpośrednio zasoby aplikacji Flask w backendzie.
            proxy_buffering off;
        }
    }
}